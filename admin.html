<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99 - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root { --red: #d32f2f; --green: #2e7d32; --gold: #ffc107; --dark: #121212; --card: #1e1e1e; }
        body { background: var(--dark); color: #fff; font-family: 'Poppins', sans-serif; padding: 15px; margin: 0; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 14px; color: var(--gold); margin-bottom: 10px; }
        label { font-size: 11px; color: #ccc; }
        input, textarea, select, button { width: 100%; padding: 10px; margin: 4px 0 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 12px; box-sizing: border-box; }
        button { background: var(--red); color: white; font-weight: bold; border: none; cursor: pointer; padding: 12px; }
        .btn-green { background: var(--green); }
        .btn-orange { background: #e65100; }
        
        .item-list { background: #262626; border-radius: 8px; padding: 10px; margin-bottom: 10px; border-left: 3px solid var(--gold); font-size: 12px; }
        .btn-group { display: flex; gap: 5px; margin-top: 8px; }
        .btn-sm { padding: 6px 10px; font-size: 10px; width: auto; flex: 1; margin: 0; }
        .tag-status { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; float: right; text-transform: uppercase; }
        .status-win { background: var(--green); color: #fff; }
        .status-lose { background: #b71c1c; color: #fff; }
        .status-pending { background: #ff9800; color: #000; }
        .type-badge { background: var(--gold); color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
        .cuota-badge { background: #1a237e; color: #90caf9; border: 1px solid #3949ab; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }

        details { background: #181818; border: 1px solid #333; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        summary { padding: 10px 12px; font-size: 12px; font-weight: bold; color: var(--gold); cursor: pointer; background: #222; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: "►"; font-size: 10px; color: #aaa; }
        details[open] summary::after { content: "▼"; color: var(--gold); }
        .accordion-content { padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div style="background:var(--red); color:white; text-align:center; padding:12px; border-radius:8px; margin-bottom:15px;">
        <h3 style="color:white; margin:0; font-weight:800;">⚙️ PANEL DE CONTROL PULSOFORT99</h3>
    </div>

    <div class="card">
        <h3>🚀 Publicar Nuevo Pronóstico</h3>
        <label>Deporte:</label>
        <select id="postCat">
            <option value="HIPISMO">🐎 HIPISMO</option>
            <option value="MLB">⚾ MLB</option>
            <option value="NBA">🏀 NBA</option>
            <option value="NFL">🏈 NFL</option>
            <option value="FUTBOL">⚽ FÚTBOL</option>
        </select>
        <label>Tipo:</label>
        <select id="postType">
            <option value="DIRECTA">DIRECTA</option>
            <option value="COMBINADA">COMBINADA (PARLAY)</option>
        </select>
        <label>Cuota / Logro:</label>
        <input type="text" id="postOdds" placeholder="Ej: -120">
        <label>Título:</label>
        <input type="text" id="postTitle" placeholder="Ej: Dodgers vs Yankees">
        <label>Detalles:</label>
        <textarea id="postDetails" rows="3"></textarea>
        <button onclick="publicarPronostico()">Publicar Pronóstico</button>
    </div>

    <div class="card">
        <h3>📢 Notificaciones</h3>
        <input type="text" id="notifTitle" placeholder="Título">
        <textarea id="notifMessage" rows="2" placeholder="Mensaje"></textarea>
        <button class="btn-orange" onclick="enviarNotificacion()">Enviar Aviso</button>
        <div id="adminNotifList"></div>
    </div>

    <div class="card">
        <h3>📈 Métricas de Efectividad</h3>
        <div id="accordionStats"></div>
    </div>

    <div class="card">
        <h3>📊 Gestión de Pronósticos</h3>
        <div id="adminPostsList"></div>
    </div>

    <div class="card">
        <h3>🔑 Claves VIP</h3>
        <input type="text" id="clientName" placeholder="Cliente">
        <input type="text" id="clientKey" placeholder="Clave (Ej: PF-889)">
        <button class="btn-green" onclick="guardarClave()">Activar Clave</button>
        <div id="adminUsersList"></div>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
    // Inicialización y carga de datos
    db.collection("pronosticos").orderBy("fecha", "desc").onSnapshot((snapshot) => {
        try {
            const list = document.getElementById('adminPostsList');
            const statsArea = document.getElementById('accordionStats');
            list.innerHTML = '';
            statsArea.innerHTML = '';

            if(snapshot.empty) {
                list.innerHTML = '<p>No hay pronósticos.</p>';
                return;
            }

            let agrupados = {};
            let statsDeporte = {};

            snapshot.forEach((doc) => {
                const p = doc.data();
                const cat = p.categoria || 'SIN CATEGORÍA';
                
                if(!agrupados[cat]) agrupados[cat] = [];
                agrupados[cat].push({ id: doc.id, ...p });

                if(!statsDeporte[cat]) statsDeporte[cat] = { wins: 0, loses: 0, cuotas: {} };
                if(p.estatus === 'win') statsDeporte[cat].wins++;
                if(p.estatus === 'lose') statsDeporte[cat].loses++;

                const cVal = p.cuota || 'GENERAL';
                if(!statsDeporte[cat].cuotas[cVal]) statsDeporte[cat].cuotas[cVal] = { wins: 0, loses: 0 };
                if(p.estatus === 'win') statsDeporte[cat].cuotas[cVal].wins++;
                if(p.estatus === 'lose') statsDeporte[cat].cuotas[cVal].loses++;
            });

            // Renderizado de Stats
            Object.keys(statsDeporte).forEach(deporte => {
                const d = statsDeporte[deporte];
                const total = d.wins + d.loses;
                const efec = total > 0 ? ((d.wins / total) * 100).toFixed(0) : 0;
                
                statsArea.innerHTML += `
                    <details>
                        <summary>${deporte}: ${efec}% efectividad</summary>
                        <div class="accordion-content">
                            <p>Wins: ${d.wins} | Loses: ${d.loses}</p>
                        </div>
                    </details>`;
            });

            // Renderizado de Lista
            Object.keys(agrupados).forEach(cat => {
                let items = '';
                agrupados[cat].forEach(p => {
                    items += `
                        <div class="item-list">
                            <span class="tag-status ${p.estatus === 'win' ? 'status-win' : p.estatus === 'lose' ? 'status-lose' : 'status-pending'}">${p.estatus || 'pendiente'}</span>
                            <b>${p.titulo}</b><br>
                            <span class="cuota-badge">${p.cuota || 'N/A'}</span>
                            <div class="btn-group">
                                <button class="btn-sm btn-green" onclick="cambiarEstatus('${p.id}', 'win')">WIN</button>
                                <button class="btn-sm" style="background:#b71c1c;" onclick="cambiarEstatus('${p.id}', 'lose')">LOSE</button>
                                <button class="btn-sm" style="background:#444;" onclick="eliminarPronostico('${p.id}')">🗑️</button>
                            </div>
                        </div>`;
                });
                list.innerHTML += `<details><summary>${cat} (${agrupados[cat].length})</summary><div class="accordion-content">${items}</div></details>`;
            });
        } catch(e) {
            console.error("Error cargando datos:", e);
            document.getElementById('adminPostsList').innerHTML = "Error al cargar. Revisa la consola.";
        }
    });

    // Funciones básicas corregidas
    function cambiarEstatus(id, status) { db.collection("pronosticos").doc(id).update({ estatus: status }); }
    function eliminarPronostico(id) { if(confirm("¿Eliminar?")) db.collection("pronosticos").doc(id).delete(); }
    function publicarPronostico() {
        const cat = document.getElementById('postCat').value;
        const titulo = document.getElementById('postTitle').value;
        if(!titulo) return alert("Falta título");
        db.collection("pronosticos").add({
            categoria: cat,
            titulo: titulo,
            cuota: document.getElementById('postOdds').value || 'N/A',
            estatus: 'pendiente',
            fecha: new Date()
        }).then(() => alert("Publicado"));
    }
</script>
</body>
</html>
