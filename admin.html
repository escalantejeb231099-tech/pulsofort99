<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - PulsoFort99</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root { --red: #d32f2f; --dark: #121212; --card: #1e1e1e; --gold: #ffc107; --green: #2e7d32; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: #fff; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; padding: 15px 0 10px; border-bottom: 2px solid var(--red); margin-bottom: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 14px; color: var(--gold); margin-bottom: 10px; }
        
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 12px; }
        textarea { height: 70px; resize: none; }
        button { background: var(--red); color: #fff; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; font-size: 13px; }
        .btn-green { background: var(--green); }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-delete { background: #b71c1c; padding: 4px 8px; font-size: 10px; width: auto; margin-top: 0; }
        .btn-status { width: auto; padding: 4px 8px; font-size: 10px; margin-top: 0; display: inline-block; }
        
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-top: 8px; cursor: pointer; }
        .checkbox-label input { width: auto; margin: 0; }

        /* ACORDEÓN POR DEPORTE */
        .accordion-item { background: #181818; border: 1px solid #333; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        .accordion-header { padding: 12px; background: #242424; cursor: pointer; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--gold); }
        .accordion-content { display: none; padding: 10px; background: #1a1a1a; }
        .accordion-content.open { display: block; }

        .post-item { background: #222; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 5px; }
        .tag { background: var(--gold); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 9px; }
        
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 4px 0; border-bottom: 1px solid #282828; }
        .stat-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⚙️ PANEL DE CONTROL</h2>
        <p style="font-size:11px; color:#aaa;">PulsoFort99 - Gestión de Pronósticos</p>
    </div>

    <!-- PUBLICAR PRONÓSTICO -->
    <div class="card">
        <h3>📝 Publicar Pronóstico</h3>
        <select id="catInput">
            <option value="HIPISMO">🐎 HIPISMO</option>
            <option value="MLB">⚾ MLB</option>
            <option value="NBA">🏀 NBA</option>
            <option value="NFL">🏈 NFL</option>
            <option value="FUTBOL">⚽ FÚTBOL</option>
        </select>
        <input type="text" id="tipoInput" placeholder="Tipo (ej: DIRECTA, PARLAY, ALTA/BAJA)">
        <input type="text" id="cuotaInput" placeholder="Cuota / Linea / Momio (ej: -120, +110, Altas 8.5)">
        <input type="text" id="tituloInput" placeholder="Título del juego / carrera">
        <textarea id="detallesInput" placeholder="Detalles de la jugada / picks..."></textarea>
        
        <label class="checkbox-label">
            <input type="checkbox" id="chkNotif" checked>
            🔔 Crear aviso/notificación al publicar
        </label>

        <button onclick="publicarPronostico()">Publicar Jugada</button>
    </div>

    <!-- ENVIAR AVISO INDEPENDIENTE -->
    <div class="card">
        <h3>📢 Enviar Aviso Solo</h3>
        <input type="text" id="avisoTitulo" placeholder="Título del aviso">
        <textarea id="avisoMensaje" placeholder="Mensaje para los usuarios..."></textarea>
        <button class="btn-gold" onclick="publicarAvisoDirecto()">Publicar Aviso Solo</button>
    </div>

    <!-- ESTADÍSTICAS POR CUOTAS / MOMIOS -->
    <div class="card">
        <h3>📊 Efectividad por Cuota / Línea</h3>
        <div id="oddsStatsArea">
            <p style="font-size:10px; color:#777; text-align:center;">Calculando cuotas...</p>
        </div>
    </div>

    <!-- HISTORIAL OCULTO POR DEPORTE (ACORDEÓN) -->
    <div class="card">
        <h3>📋 Pronósticos Publicados (Por Deporte)</h3>
        <p style="font-size:10px; color:#aaa; margin-bottom:10px;">Haz clic en un deporte para desplegar sus jugadas.</p>
        <div id="accordionContainer">
            <p style="font-size:11px; color:#777; text-align:center;">Cargando categorías...</p>
        </div>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
    let pronosticosData = [];

    // Cargar y Renderizar Pronósticos + Estadísticas
    db.collection("pronosticos").orderBy("fecha", "desc").onSnapshot((snapshot) => {
        pronosticosData = [];
        snapshot.forEach(doc => {
            pronosticosData.push({ id: doc.id, ...doc.data() });
        });
        
        renderizarAcordeonDeportes();
        calcularEstadisticasCuotas();
    });

    // 1. PUBLICAR PRONÓSTICO
    function publicarPronostico() {
        const cat = document.getElementById('catInput').value;
        const tipo = document.getElementById('tipoInput').value.trim() || 'DIRECTA';
        const cuota = document.getElementById('cuotaInput').value.trim() || 'N/A';
        const titulo = document.getElementById('tituloInput').value.trim();
        const detalles = document.getElementById('detallesInput').value.trim();
        const enviarAviso = document.getElementById('chkNotif').checked;

        if(!titulo || !detalles) return alert("Por favor completa el título y los detalles.");

        db.collection("pronosticos").add({
            categoria: cat,
            tipo: tipo,
            cuota: cuota,
            titulo: titulo,
            detalles: detalles,
            estatus: 'pendiente',
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            if(enviarAviso) {
                db.collection("notificaciones").add({
                    titulo: `⚡ NUEVA JUGADA: ${cat}`,
                    mensaje: `${titulo} (${tipo}) - Revisa el panel VIP.`,
                    fecha: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            alert("✔ Jugada publicada con éxito");
            document.getElementById('tituloInput').value = '';
            document.getElementById('detallesInput').value = '';
            document.getElementById('tipoInput').value = '';
            document.getElementById('cuotaInput').value = '';
        });
    }

    // 2. PUBLICAR AVISO DIRECTO
    function publicarAvisoDirecto() {
        const titulo = document.getElementById('avisoTitulo').value.trim();
        const mensaje = document.getElementById('avisoMensaje').value.trim();

        if(!titulo || !mensaje) return alert("Ingresa título y mensaje para el aviso.");

        db.collection("notificaciones").add({
            titulo: titulo,
            mensaje: mensaje,
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("📢 Aviso publicado correctamente");
            document.getElementById('avisoTitulo').value = '';
            document.getElementById('avisoMensaje').value = '';
        });
    }

    // 3. RENDERIZAR ACORDEÓN POR DEPORTES (HISTORIAL LIMPIO)
    function renderizarAcordeonDeportes() {
        const container = document.getElementById('accordionContainer');
        container.innerHTML = '';

        const grupos = {};

        // Agrupar por Deporte
        pronosticosData.forEach(item => {
            const cat = item.categoria || 'OTROS';
            if(!grupos[cat]) grupos[cat] = [];
            grupos[cat].push(item);
        });

        const categoriasKeys = Object.keys(grupos);

        if(categoriasKeys.length === 0) {
            container.innerHTML = '<p style="font-size:11px; color:#777; text-align:center;">No hay pronósticos registrados.</p>';
            return;
        }

        categoriasKeys.forEach((cat, index) => {
            const items = grupos[cat];
            
            let htmlItems = '';
            items.forEach(p => {
                let badgeColor = '#ff9800';
                if(p.estatus === 'win') badgeColor = '#4caf50';
                if(p.estatus === 'lose') badgeColor = '#f44336';

                htmlItems += `
                    <div class="post-item">
                        <div class="post-header">
                            <div>
                                <span class="tag">${p.tipo || 'DIRECTA'}</span>
                                ${p.cuota ? `<span style="color:var(--gold); font-weight:bold; font-size:10px; margin-left:4px;">[${p.cuota}]</span>` : ''}
                            </div>
                            <span style="color:${badgeColor}; font-weight:bold; font-size:10px; text-transform:uppercase;">${p.estatus}</span>
                        </div>
                        <strong style="font-size:12px; display:block; margin-bottom:4px; color:#fff;">${p.titulo}</strong>
                        <p style="font-size:11px; color:#ccc; white-space:pre-line; margin-bottom:8px;">${p.detalles}</p>
                        
                        <div style="display:flex; gap:5px; flex-wrap:wrap; align-items:center;">
                            <button class="btn-status btn-green" onclick="cambiarEstatus('${p.id}', 'win')">WIN 🟢</button>
                            <button class="btn-status" style="background:#b71c1c;" onclick="cambiarEstatus('${p.id}', 'lose')">LOSE 🔴</button>
                            <button class="btn-status" style="background:#ff9800; color:#000;" onclick="cambiarEstatus('${p.id}', 'pendiente')">PENDIENTE 🟠</button>
                            <button class="btn-delete" onclick="eliminarPronostico('${p.id}')">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML += `
                <div class="accordion-item">
                    <div class="accordion-header" onclick="toggleAccordion('acc-${index}')">
                        <span>${cat} (${items.length})</span>
                        <span>▼</span>
                    </div>
                    <div class="accordion-content" id="acc-${index}">
                        ${htmlItems}
                    </div>
                </div>
            `;
        });
    }

    function toggleAccordion(id) {
        const content = document.getElementById(id);
        content.classList.toggle('open');
    }

    // 4. CAMBIAR ESTATUS Y ELIMINAR
    function cambiarEstatus(id, nuevoEstatus) {
        db.collection("pronosticos").doc(id).update({ estatus: nuevoEstatus });
    }

    function eliminarPronostico(id) {
        if(confirm("¿Seguro de que deseas eliminar este pronóstico?")) {
            db.collection("pronosticos").doc(id).delete();
        }
    }

    // 5. ESTADÍSTICAS POR CUOTAS / MOMIOS (% DE ACIERTO)
    function calcularEstadisticasCuotas() {
        const area = document.getElementById('oddsStatsArea');
        area.innerHTML = '';

        const statsCuota = {};

        pronosticosData.forEach(p => {
            if(!p.cuota || p.cuota === 'N/A') return;
            const c = p.cuota.toUpperCase().trim();

            if(!statsCuota[c]) statsCuota[c] = { wins: 0, loses: 0 };

            if(p.estatus === 'win') statsCuota[c].wins++;
            if(p.estatus === 'lose') statsCuota[c].loses++;
        });

        const cuotasKeys = Object.keys(statsCuota);

        if(cuotasKeys.length === 0) {
            area.innerHTML = '<p style="font-size:10px; color:#777; text-align:center;">No hay cuotas registradas aún.</p>';
            return;
        }

        cuotasKeys.forEach(cuota => {
            const w = statsCuota[cuota].wins;
            const l = statsCuota[cuota].loses;
            const total = w + l;
            const efec = total > 0 ? ((w / total) * 100).toFixed(1) : 0;

            area.innerHTML += `
                <div class="stat-row">
                    <span style="color:var(--gold); font-weight:bold;">Cuota ${cuota}</span>
                    <span style="color:#aaa;">
                        <b style="color:#4caf50;">${w}W</b> - <b style="color:#f44336;">${l}L</b> | 
                        <b style="color:#fff;">${efec}% Acierto</b>
                    </span>
                </div>
            `;
        });
    }
</script>
</body>
    </html>
