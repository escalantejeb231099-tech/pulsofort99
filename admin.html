<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Pronósticos Deportivos</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --win: #22c55e;
      --lose: #ef4444;
      --pending: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2 {
      margin-bottom: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 5px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-delete {
      background-color: var(--lose);
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    /* Tablas y Secciones por Deporte */
    .sport-section {
      margin-bottom: 20px;
    }

    .sport-title {
      font-size: 1.1rem;
      color: var(--accent);
      border-bottom: 2px solid var(--border);
      padding-bottom: 5px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-muted);
      background-color: rgba(0,0,0,0.2);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-win { background-color: rgba(34, 197, 94, 0.2); color: var(--win); }
    .badge-lose { background-color: rgba(239, 68, 68, 0.2); color: var(--lose); }
    .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: var(--pending); }

    /* Estilos de Estadísticas */
    .stats-summary {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 5px;
    }

    .stat-box {
      flex: 1;
      text-align: center;
    }

    .stat-val {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .text-win { color: var(--win); }
    .text-lose { color: var(--lose); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Panel de Gestión de Pronósticos</h1>

    <!-- FORMULARIO PARA REGISTRAR -->
    <div class="card">
      <h2>Publicar Nuevo Pronóstico</h2>
      <form id="forecast-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="sport">Deporte</label>
            <select id="sport" required>
              <option value="Béisbol (MLB)">Béisbol (MLB)</option>
              <option value="Fútbol">Fútbol</option>
              <option value="Baloncesto (NBA)">Baloncesto (NBA)</option>
              <option value="Hípica">Hípica</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="team">Equipo / Selección</label>
            <input type="text" id="team" placeholder="Ej: New York Yankees" required>
          </div>
          <div class="form-group">
            <label for="play">Jugada / Logro</label>
            <input type="text" id="play" placeholder="Ej: ML -150 o RL -1.5" required>
          </div>
          <div class="form-group">
            <label for="status">Estado Inicial</label>
            <select id="status">
              <option value="PENDIENTE">PENDIENTE</option>
              <option value="WIN">WIN (Ganado)</option>
              <option value="LOSE">LOSE (Perdido)</option>
            </select>
          </div>
        </div>
        <button type="submit">Guardar Pronóstico</button>
      </form>
    </div>

    <!-- SECCIÓN DE PRONÓSTICOS PUBLICADOS POR DEPORTE -->
    <div class="card">
      <h2>Pronósticos Publicados por Deporte</h2>
      <div id="forecasts-container"></div>
    </div>

    <!-- SECCIÓN DE ESTADÍSTICAS POR LOGRO Y DEPORTE -->
    <div class="card">
      <h2>Estadísticas de Logros por Deporte</h2>
      <div id="stats-container"></div>
    </div>
  </div>

  <script>
    // Cargar datos iniciales del localStorage o inicializar array
    let forecasts = JSON.parse(localStorage.getItem('forecasts_db')) || [];

    const form = document.getElementById('forecast-form');
    const forecastsContainer = document.getElementById('forecasts-container');
    const statsContainer = document.getElementById('stats-container');

    // Guardar nuevo pronóstico
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newForecast = {
        id: Date.now(),
        sport: document.getElementById('sport').value,
        team: document.getElementById('team').value,
        play: document.getElementById('play').value,
        status: document.getElementById('status').value
      };

      forecasts.push(newForecast);
      saveAndRender();
      form.reset();
    });

    // Cambiar estado de un pronóstico
    function updateStatus(id, newStatus) {
      forecasts = forecasts.map(item => item.id === id ? { ...item, status: newStatus } : item);
      saveAndRender();
    }

    // Eliminar un pronóstico
    function deleteForecast(id) {
      forecasts = forecasts.filter(item => item.id !== id);
      saveAndRender();
    }

    // Guardar en LocalStorage y renderizar
    function saveAndRender() {
      localStorage.setItem('forecasts_db', JSON.stringify(forecasts));
      renderForecasts();
      renderStats();
    }

    // Agrupar elementos por deporte
    function groupBySport(data) {
      return data.reduce((acc, obj) => {
        const key = obj.sport;
        if (!acc[key]) acc[key] = [];
        acc[key].push(obj);
        return acc;
      }, {});
    }

    // Renderizar lista de pronósticos estructurados por Deporte
    function renderForecasts() {
      forecastsContainer.innerHTML = '';
      
      if (forecasts.length === 0) {
        forecastsContainer.innerHTML = '<p style="color: var(--text-muted)">No hay pronósticos registrados.</p>';
        return;
      }

      const grouped = groupBySport(forecasts);

      for (const sport in grouped) {
        const section = document.createElement('div');
        section.className = 'sport-section';

        let rowsHTML = grouped[sport].map(f => `
          <tr>
            <td><strong>${f.team}</strong></td>
            <td>${f.play}</td>
            <td>
              <select onchange="updateStatus(${f.id}, this.value)">
                <option value="PENDIENTE" ${f.status === 'PENDIENTE' ? 'selected' : ''}>PENDIENTE</option>
                <option value="WIN" ${f.status === 'WIN' ? 'selected' : ''}>WIN</option>
                <option value="LOSE" ${f.status === 'LOSE' ? 'selected' : ''}>LOSE</option>
              </select>
            </td>
            <td>
              <button class="btn-delete" onclick="deleteForecast(${f.id})">Eliminar</button>
            </td>
          </tr>
        `).join('');

        section.innerHTML = `
          <div class="sport-title">${sport}</div>
          <table>
            <thead>
              <tr>
                <th>Equipo / Selección</th>
                <th>Jugada / Logro</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHTML}
            </tbody>
          </table>
        `;
        forecastsContainer.appendChild(section);
      }
    }

    // Renderizar Estadísticas por Deporte y Jugada/Equipo
    function renderStats() {
      statsContainer.innerHTML = '';

      if (forecasts.length === 0) {
        statsContainer.innerHTML = '<p style="color: var(--text-muted)">Sin datos para estadísticas.</p>';
        return;
      }

      const grouped = groupBySport(forecasts);

      for (const sport in grouped) {
        const items = grouped[sport];
        
        // Totales del deporte
        const totalEvaluated = items.filter(i => i.status !== 'PENDIENTE').length;
        const wins = items.filter(i => i.status === 'WIN').length;
        const losses = items.filter(i => i.status === 'LOSE').length;
        const pending = items.filter(i => i.status === 'PENDIENTE').length;

        const winRate = totalEvaluated > 0 ? ((wins / totalEvaluated) * 100).toFixed(1) : '0.0';
        const loseRate = totalEvaluated > 0 ? ((losses / totalEvaluated) * 100).toFixed(1) : '0.0';

        const section = document.createElement('div');
        section.className = 'sport-section';

        // Detalle por Equipo y Jugada
        let detailsHTML = items.map(f => {
          let badgeClass = 'badge-pending';
          if (f.status === 'WIN') badgeClass = 'badge-win';
          if (f.status === 'LOSE') badgeClass = 'badge-lose';

          return `
            <tr>
              <td>${f.team}</td>
              <td>${f.play}</td>
              <td><span class="badge ${badgeClass}">${f.status}</span></td>
            </tr>
          `;
        }).join('');

        section.innerHTML = `
          <div class="sport-title">${sport}</div>
          
          <div class="stats-summary">
            <div class="stat-box">
              <label>Aciertos (% Win)</label>
              <div class="stat-val text-win">${winRate}%</div>
              <small>(${wins} Ganados)</small>
            </div>
            <div class="stat-box">
              <label>Desaciertos (% Lose)</label>
              <div class="stat-val text-lose">${loseRate}%</div>
              <small>(${losses} Perdidos)</small>
            </div>
            <div class="stat-box">
              <label>Pendientes</label>
              <div class="stat-val">${pending}</div>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Equipo / Selección</th>
                <th>Jugada / Logro</th>
                <th>Resultado</th>
              </tr>
            </thead>
            <tbody>
              ${detailsHTML}
            </tbody>
          </table>
        `;

        statsContainer.appendChild(section);
      }
    }

    // Carga inicial
    saveAndRender();
  </script>
</body>
</html>
