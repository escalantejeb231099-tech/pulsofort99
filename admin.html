<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99 - Admin & Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: 'Poppins', sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 14px; color: #ffc107; margin-bottom: 10px; }
        input, textarea, button { width: 100%; padding: 10px; margin: 4px 0 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 12px; box-sizing: border-box; }
        button { background: #d32f2f; color: white; font-weight: bold; border: none; cursor: pointer; padding: 12px; }
        .btn-green { background: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <div style="background:#d32f2f; color:white; text-align:center; padding:12px; border-radius:8px; margin-bottom:15px;">
        <h3 style="color:white; margin:0; font-weight:800;">⚙️ PANEL DE CONTROL PULSOFORT99</h3>
    </div>

    <!-- CONTROL DE ESTADÍSTICAS -->
    <div class="card">
        <h3>📊 Actualizar Estadísticas de Efectividad</h3>
        <label style="font-size:11px;">Porcentaje de Acierto (%):</label>
        <input type="number" id="stWinrateInput" placeholder="Ej: 85">
        <label style="font-size:11px;">Jugadas Ganadas:</label>
        <input type="number" id="stWinsInput" placeholder="Ej: 42">
        <label style="font-size:11px;">Jugadas Perdidas:</label>
        <input type="number" id="stLossesInput" placeholder="Ej: 7">
        <button class="btn-green" onclick="guardarEstadisticas()">Actualizar Estadísticas Públicas</button>
    </div>

    <div class="card">
        <h3>🖼️ Configurar Logo y WhatsApp</h3>
        <label style="font-size:11px;">URL del Logo:</label>
        <input type="text" id="logoUrl" placeholder="https://i.imgur.com/logo.png">
        <label style="font-size:11px;">Número de WhatsApp:</label>
        <input type="text" id="wsNum" placeholder="+584121234567">
        <button onclick="guardarConfigGeneral()">Guardar Logo y Contacto</button>
    </div>

    <div class="card">
        <h3>💳 Configurar Métodos de Pago</h3>
        <label style="font-size:11px;">Pago Móvil:</label>
        <textarea id="pmData" rows="3" placeholder="Banco, Cédula, Teléfono..."></textarea>
        <label style="font-size:11px;">Binance Pay:</label>
        <textarea id="binanceData" rows="2" placeholder="Binance ID / Correo..."></textarea>
        <label style="font-size:11px;">Otros Métodos:</label>
        <textarea id="otrosData" rows="2" placeholder="Zelle, Efectivo..."></textarea>
        <button onclick="guardarConfigPagos()">Guardar Métodos de Pago</button>
    </div>

    <div class="card">
        <h3>🔑 Activar Clave VIP</h3>
        <input type="text" id="clientName" placeholder="Nombre del Cliente">
        <input type="text" id="clientKey" placeholder="Clave VIP (Ej: PF-889)">
        <button class="btn-green" onclick="guardarClave()">Activar Clave VIP</button>
    </div>

    <div class="card">
        <h3>🚀 Publicar Pronóstico</h3>
        <input type="text" id="postCat" placeholder="Categoría (La Rinconada, MLB...)">
        <input type="text" id="postTitle" placeholder="Título">
        <textarea id="postDetails" rows="4" placeholder="Detalles secretos..."></textarea>
        <button onclick="publicarPronostico()">Publicar Pronóstico</button>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
    // Cargar Estadísticas Existentes
    db.collection("configuracion").doc("estadisticas").get().then((doc) => {
        if(doc.exists) {
            document.getElementById('stWinrateInput').value = doc.data().winrate || '';
            document.getElementById('stWinsInput').value = doc.data().ganados || '';
            document.getElementById('stLossesInput').value = doc.data().perdidos || '';
        }
    });

    db.collection("configuracion").doc("general").get().then((doc) => {
        if(doc.exists) {
            document.getElementById('logoUrl').value = doc.data().logoUrl || '';
            document.getElementById('wsNum').value = doc.data().whatsapp || '';
        }
    });

    db.collection("configuracion").doc("pagos").get().then((doc) => {
        if(doc.exists) {
            document.getElementById('pmData').value = doc.data().pagoMovil || '';
            document.getElementById('binanceData').value = doc.data().binance || '';
            document.getElementById('otrosData').value = doc.data().otros || '';
        }
    });

    function guardarEstadisticas() {
        const wr = document.getElementById('stWinrateInput').value.trim();
        const wins = document.getElementById('stWinsInput').value.trim();
        const losses = document.getElementById('stLossesInput').value.trim();
        db.collection("configuracion").doc("estadisticas").set({ winrate: wr, ganados: wins, perdidos: losses }, { merge: true })
        .then(() => alert("✔ Estadísticas actualizadas correctamente."));
    }

    function guardarConfigGeneral() {
        const logo = document.getElementById('logoUrl').value.trim();
        const ws = document.getElementById('wsNum').value.trim();
        db.collection("configuracion").doc("general").set({ logoUrl: logo, whatsapp: ws }, { merge: true })
        .then(() => alert("✔ Logo y WhatsApp guardados."));
    }

    function guardarConfigPagos() {
        const pm = document.getElementById('pmData').value.trim();
        const binance = document.getElementById('binanceData').value.trim();
        const otros = document.getElementById('otrosData').value.trim();
        db.collection("configuracion").doc("pagos").set({ pagoMovil: pm, binance: binance, otros: otros }, { merge: true })
        .then(() => alert("✔ Métodos de pago guardados."));
    }

    function guardarClave() {
        const cliente = document.getElementById('clientName').value.trim();
        const clave = document.getElementById('clientKey').value.trim().toUpperCase();
        if(!cliente || !clave) return alert("Completa los datos.");
        db.collection("claves").doc(clave).set({ cliente: cliente, activa: true })
        .then(() => { alert(`✔ Clave ${clave} activada`); document.getElementById('clientName').value = ''; document.getElementById('clientKey').value = ''; });
    }

    function publicarPronostico() {
        const cat = document.getElementById('postCat').value.trim();
        const titulo = document.getElementById('postTitle').value.trim();
        const detalles = document.getElementById('postDetails').value.trim();
        if(!titulo || !detalles) return alert("Completa el pronóstico.");
        db.collection("pronosticos").add({ categoria: cat || 'VIP', titulo: titulo, detalles: detalles, fecha: new Date() })
        .then(() => { alert("🚀 Pronóstico publicado."); document.getElementById('postTitle').value = ''; document.getElementById('postDetails').value = ''; });
    }
</script>
</body>
</html>
