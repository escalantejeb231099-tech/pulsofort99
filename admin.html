<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99 - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root { --red: #d32f2f; --green: #2e7d32; --gold: #ffc107; --dark: #121212; --card: #1e1e1e; }
        body { background: var(--dark); color: #fff; font-family: 'Poppins', sans-serif; padding: 15px; margin: 0; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 14px; color: var(--gold); margin-bottom: 10px; }
        label { font-size: 11px; color: #ccc; }
        input, textarea, select, button { width: 100%; padding: 10px; margin: 4px 0 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 12px; box-sizing: border-box; }
        button { background: var(--red); color: white; font-weight: bold; border: none; cursor: pointer; padding: 12px; }
        .btn-green { background: var(--green); }
        .btn-orange { background: #e65100; }
        
        .item-list { background: #262626; border-radius: 8px; padding: 10px; margin-bottom: 10px; border-left: 3px solid var(--gold); font-size: 12px; }
        .btn-group { display: flex; gap: 5px; margin-top: 8px; }
        .btn-sm { padding: 6px 10px; font-size: 10px; width: auto; flex: 1; margin: 0; }
        .tag-status { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; float: right; text-transform: uppercase; }
        .status-win { background: var(--green); color: #fff; }
        .status-lose { background: #b71c1c; color: #fff; }
        .status-pending { background: #ff9800; color: #000; }
        .type-badge { background: var(--gold); color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
        .cuota-badge { background: #1a237e; color: #90caf9; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }

        details { background: #181818; border: 1px solid #333; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        summary { padding: 12px; font-size: 13px; font-weight: bold; color: var(--gold); cursor: pointer; background: #222; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: "►"; font-size: 10px; color: #aaa; }
        details[open] summary::after { content: "▼"; color: var(--gold); }
        .accordion-content { padding: 10px; }
        .stats-box { background: #111; padding: 8px; border-radius: 6px; margin-bottom: 10px; border: 1px dashed var(--gold); font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div style="background:var(--red); color:white; text-align:center; padding:12px; border-radius:8px; margin-bottom:15px;">
        <h3 style="color:white; margin:0; font-weight:800;">⚙️ PANEL DE CONTROL PULSOFORT99</h3>
    </div>

    <!-- 1. PUBLICAR PRONÓSTICO -->
    <div class="card">
        <h3>🚀 Publicar Nuevo Pronóstico</h3>
        <label>Deporte / Categoría:</label>
        <select id="postCat">
            <option value="HIPISMO">🐎 HIPISMO</option>
            <option value="MLB">⚾ MLB</option>
            <option value="NBA">🏀 NBA</option>
            <option value="NFL">🏈 NFL</option>
            <option value="FUTBOL">⚽ FÚTBOL</option>
        </select>
        
        <label>Tipo de Jugada:</label>
        <select id="postType">
            <option value="DIRECTA">DIRECTA</option>
            <option value="COMBINADA">COMBINADA (PARLAY)</option>
        </select>

        <label>Cuota / Momio / Logro:</label>
        <input type="text" id="postCuota" placeholder="Ej: Alta 8.5, -120">

        <label>Título / Partido:</label>
        <input type="text" id="postTitle" placeholder="Ej: Dodgers vs Yankees">
        
        <label>Detalles del Pronóstico:</label>
        <textarea id="postDetails" rows="3" placeholder="Detalles de la jugada..."></textarea>
        
        <button onclick="publicarPronostico()">Publicar Pronóstico</button>
    </div>

    <!-- 2. GESTIÓN POR ACORDEÓN -->
    <div class="card">
        <h3>📊 Gestión de Pronósticos por Deporte</h3>
        <p style="font-size:10px; color:#aaa; margin-bottom:10px;">Clic en cada deporte para ver jugadas y efectividad.</p>
        <div id="adminAccordionList">
            <p style="font-size:11px; color:#777;">Cargando...</p>
        </div>
    </div>

    <!-- 3. GESTIÓN VIP -->
    <div class="card">
        <h3>🔑 Gestión de Claves y Acceso VIP</h3>
        <input type="text" id="clientName" placeholder="Nombre del Cliente">
        <input type="text" id="clientKey" placeholder="Clave VIP (Ej: PF-889)">
        <button class="btn-green" onclick="guardarClave()">Activar Nueva Clave VIP</button>
        <div id="adminUsersList" style="margin-top:15px;"></div>
    </div>

    <!-- 4. CONFIGURACIONES -->
    <div class="card">
        <h3>🖼️ Configurar Logo y Contacto</h3>
        <input type="text" id="logoUrl" placeholder="URL del Logo">
        <input type="text" id="wsNum" placeholder="WhatsApp">
        <button onclick="guardarConfigGeneral()">Guardar Config</button>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
    // CARGAR CONFIG
    db.collection("configuracion").doc("general").get().then((doc) => {
        if(doc.exists) {
            document.getElementById('logoUrl').value = doc.data().logoUrl || '';
            document.getElementById('wsNum').value = doc.data().whatsapp || '';
        }
    });

    function guardarConfigGeneral() {
        db.collection("configuracion").doc("general").set({
            logoUrl: document.getElementById('logoUrl').value.trim(),
            whatsapp: document.getElementById('wsNum').value.trim()
        }, { merge: true }).then(() => alert("✔ Guardado."));
    }

    function publicarPronostico() {
        const cat = document.getElementById('postCat').value;
        const tipo = document.getElementById('postType').value;
        const cuota = document.getElementById('postCuota').value.trim() || 'GENERAL';
        const titulo = document.getElementById('postTitle').value.trim();
        const detalles = document.getElementById('postDetails').value.trim();
        if(!titulo || !detalles) return alert("Completa los datos.");

        db.collection("pronosticos").add({
            categoria: cat, tipo: tipo, cuota: cuota, titulo: titulo, detalles: detalles,
            estatus: "pendiente", fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("🚀 Publicado.");
            document.getElementById('postTitle').value = '';
            document.getElementById('postDetails').value = '';
            document.getElementById('postCuota').value = '';
        });
    }

    // LISTENER DE PRONÓSTICOS MODO ACORDEÓN
    db.collection("pronosticos").onSnapshot((snapshot) => {
        const accordion = document.getElementById('adminAccordionList');
        if(!accordion) return;
        accordion.innerHTML = '';
        if(snapshot.empty) return accordion.innerHTML = '<p style="font-size:11px; color:#777;">No hay pronósticos.</p>';

        let deportes = {};
        snapshot.forEach((doc) => {
            const p = doc.data();
            const dep = p.categoria || 'VARIOS';
            if(!deportes[dep]) deportes[dep] = { items: [], momios: {} };
            deportes[dep].items.push({ id: doc.id, ...p });
            const m = p.cuota || 'GENERAL';
            if(!deportes[dep].momios[m]) deportes[dep].momios[m] = { wins: 0, loses: 0 };
            if(p.estatus === 'win') deportes[dep].momios[m].wins++;
            if(p.estatus === 'lose') deportes[dep].momios[m].loses++;
        });

        Object.keys(deportes).forEach((dep) => {
            const grupo = deportes[dep];
            let itemsHtml = '', momiosHtml = '';
            Object.keys(grupo.momios).forEach((m) => {
                const w = grupo.momios[m].wins, l = grupo.momios[m].loses, efec = (w+l) > 0 ? ((w/(w+l))*100).toFixed(0) : 0;
                momiosHtml += `<div>• <b>${m}</b>: ${w}W-${l}L (${efec}%)</div>`;
            });
            grupo.items.forEach((p) => {
                const badge = p.estatus === 'win' ? 'status-win' : (p.estatus === 'lose' ? 'status-lose' : 'status-pending');
                itemsHtml += `<div class="item-list"><span class="tag-status ${badge}">${p.estatus}</span><b>${p.titulo}</b><div class="btn-group"><button class="btn-sm btn-green" onclick="cambiarEstatus('${p.id}', 'win')">WIN</button><button class="btn-sm" style="background:#b71c1c" onclick="cambiarEstatus('${p.id}', 'lose')">LOSE</button><button class="btn-sm" style="background:#444" onclick="eliminarPronostico('${p.id}')">🗑️</button></div></div>`;
            });
            accordion.innerHTML += `<details><summary>${dep} (${grupo.items.length})</summary><div class="accordion-content"><div class="stats-box">${momiosHtml}</div>${itemsHtml}</div></details>`;
        });
    });

    function cambiarEstatus(id, status) { db.collection("pronosticos").doc(id).update({ estatus: status }); }
    function eliminarPronostico(id) { if(confirm("¿Eliminar?")) db.collection("pronosticos").doc(id).delete(); }

    // CLAVES VIP
    function guardarClave() {
        const cliente = document.getElementById('clientName').value.trim();
        const clave = document.getElementById('clientKey').value.trim().toUpperCase();
        if(!cliente || !clave) return alert("Completa los datos.");
        db.collection("claves").doc(clave).set({ cliente, activa: true, fecha: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => alert("✔ Clave activada."));
    }

    db.collection("claves").onSnapshot((snapshot) => {
        const list = document.getElementById('adminUsersList');
        list.innerHTML = '';
        snapshot.forEach((doc) => {
            list.innerHTML += `<div class="item-list"><b>${doc.data().cliente}</b> | Clave: ${doc.id} <button class="btn-sm" style="background:#444; float:right" onclick="eliminarClave('${doc.id}')">🗑️</button></div>`;
        });
    });
    function eliminarClave(clave) { if(confirm("¿Eliminar clave?")) db.collection("claves").doc(clave).delete(); }
</script>
</body>
</html>
