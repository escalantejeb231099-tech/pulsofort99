<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99 - Panel de Administración</title>
    
    <link rel="apple-touch-icon" href="https://i.postimg.cc/pVsx2bBr/IMG-20250608-151525.jpg">
    <link rel="icon" href="https://i.postimg.cc/pVsx2bBr/IMG-20250608-151525.jpg" type="image/jpeg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root { --red: #d32f2f; --dark: #121212; --card: #1e1e1e; --gold: #ffc107; --green: #2e7d32; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: #fff; padding: 15px; padding-bottom: 40px; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 15px 0 10px; border-bottom: 2px solid var(--red); margin-bottom: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #333; }
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #444; font-size: 13px; background: #2a2a2a; color: #fff; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: var(--red); color: #fff; font-weight: bold; cursor: pointer; border: none; }
        .btn-green { background: var(--green); }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-danger { background: #b71c1c; }

        .tag { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; }
        .type-tag { background: #333; color: var(--gold); border: 1px solid var(--gold); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; margin-left: 5px; }
        .cuota-tag { background: #1a237e; color: #90caf9; border: 1px solid #3949ab; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; margin-left: 5px; }
        .status-badge { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; float: right; text-transform: uppercase; }
        .bg-win { background: var(--green); color: #fff; }
        .bg-lose { background: #b71c1c; color: #fff; }
        .bg-pending { background: #ff9800; color: #000; }

        .item-actions { display: flex; gap: 6px; margin-top: 10px; }
        .item-actions button { padding: 8px; font-size: 11px; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="font-weight:800;">⚙️ ADMIN <span style="color:var(--red);">PULSOFORT99</span></h2>
        <p style="font-size:11px; color:#aaa;">Panel de Publicación y Control de Pronósticos</p>
    </div>

    <!-- PUBLICAR PRONÓSTICO -->
    <div class="card">
        <h3 style="font-size:14px; color:var(--gold); margin-bottom:8px;">📌 Crear / Publicar Pronóstico</h3>
        
        <label style="font-size:11px; color:#aaa;">Deporte / Disciplina:</label>
        <select id="pCategoria">
            <option value="HIPISMO">🐎 HIPISMO</option>
            <option value="MLB">⚾ MLB</option>
            <option value="NBA">🏀 NBA</option>
            <option value="NFL">🏈 NFL</option>
            <option value="FUTBOL">⚽ FÚTBOL</option>
        </select>

        <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">Tipo de Pronóstico:</label>
        <select id="pTipo">
            <option value="DIRECTA">DIRECTA</option>
            <option value="PARLAY">PARLAY</option>
            <option value="HEAVY BET">HEAVY BET</option>
            <option value="ALTA / BAJA">ALTA / BAJA</option>
            <option value="DATACE">DATACE / FIJO</option>
        </select>

        <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">Cuota / Logro (Ej: -120, +150, Alta 8.5):</label>
        <input type="text" id="pCuota" placeholder="Ejemplo: -120, Alta 8.5, Runline">

        <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">Título del Pronóstico:</label>
        <input type="text" id="pTitulo" placeholder="Ej: Dodgers Moneyline / 5ta La Rinconada">

        <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">Detalles del Análisis (VIP):</label>
        <textarea id="pDetalles" placeholder="Escribe el análisis detallado aquí..."></textarea>

        <button onclick="guardarPronostico()" class="btn-green" style="margin-top:12px;">🚀 Publicar Pronóstico</button>
    </div>

    <!-- NOTIFICACIONES EN VIVO / AVISOS -->
    <div class="card">
        <h3 style="font-size:14px; color:var(--gold); margin-bottom:8px;">📢 Emitir Aviso en Vivo</h3>
        <input type="text" id="aTitulo" placeholder="Título del aviso (Ej: 🔥 Alerta de Última Hora)">
        <textarea id="aMensaje" placeholder="Mensaje para los usuarios..."></textarea>
        <button onclick="enviarAviso()" class="btn-gold">Enviar Aviso</button>
    </div>

    <!-- LISTADO DE PRONÓSTICOS PUBLICADOS Y CONTROL WIN/LOSE -->
    <h3 style="font-size:14px; color:#fff; margin-bottom:10px;">📋 Gestor de Pronósticos Activos</h3>
    <div id="adminPostsList">
        <p style="font-size:12px; color:#777;">Cargando datos...</p>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
    function guardarPronostico() {
        const categoria = document.getElementById('pCategoria').value;
        const tipo = document.getElementById('pTipo').value;
        const cuota = document.getElementById('pCuota').value.trim() || 'GENERAL';
        const titulo = document.getElementById('pTitulo').value.trim();
        const detalles = document.getElementById('pDetalles').value.trim();

        if(!titulo || !detalles) {
            return alert("Por favor completa el título y los detalles del pronóstico.");
        }

        db.collection("pronosticos").add({
            categoria: categoria,
            tipo: tipo,
            cuota: cuota,
            titulo: titulo,
            detalles: detalles,
            estatus: 'pendiente',
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("✅ Pronóstico publicado con éxito.");
            document.getElementById('pTitulo').value = '';
            document.getElementById('pDetalles').value = '';
            document.getElementById('pCuota').value = '';
        }).catch(err => {
            console.error("Error al publicar:", err);
            alert("❌ Ocurrió un error al guardar.");
        });
    }

    function enviarAviso() {
        const titulo = document.getElementById('aTitulo').value.trim();
        const mensaje = document.getElementById('aMensaje').value.trim();

        if(!mensaje) return alert("Escribe un mensaje para el aviso.");

        db.collection("notificaciones").add({
            titulo: titulo || '📢 AVISO',
            mensaje: mensaje,
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("📢 Aviso publicado correctamente.");
            document.getElementById('aTitulo').value = '';
            document.getElementById('aMensaje').value = '';
        });
    }

    function cambiarEstatus(id, nuevoEstatus) {
        db.collection("pronosticos").doc(id).update({
            estatus: nuevoEstatus
        });
    }

    function eliminarPronostico(id) {
        if(confirm("¿Seguro que deseas eliminar este pronóstico?")) {
            db.collection("pronosticos").doc(id).delete();
        }
    }

    db.collection("pronosticos").orderBy("fecha", "desc").onSnapshot((snapshot) => {
        const contenedor = document.getElementById('adminPostsList');
        contenedor.innerHTML = '';

        if(snapshot.empty) {
            contenedor.innerHTML = '<p style="font-size:12px; color:#777; text-align:center;">No hay pronósticos registrados.</p>';
            return;
        }

        snapshot.forEach((doc) => {
            const item = doc.data();
            const id = doc.id;

            let badgeClass = 'bg-pending';
            let badgeText = 'PENDIENTE';
            if(item.estatus === 'win') { badgeClass = 'bg-win'; badgeText = 'WIN 🟢'; }
            if(item.estatus === 'lose') { badgeClass = 'bg-lose'; badgeText = 'LOSE 🔴'; }

            contenedor.innerHTML += `
                <div class="card">
                    <span class="tag">${item.categoria}</span>
                    <span class="type-tag">${item.tipo || 'DIRECTA'}</span>
                    <span class="cuota-tag">${item.cuota || 'GENERAL'}</span>
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <h4 style="margin:8px 0 4px; font-size:13px;">${item.titulo}</h4>
                    <p style="font-size:11px; color:#ccc; white-space: pre-line;">${item.detalles}</p>
                    
                    <div class="item-actions">
                        <button onclick="cambiarEstatus('${id}', 'win')" class="btn-green">🟢 WIN</button>
                        <button onclick="cambiarEstatus('${id}', 'lose')" class="btn-danger">🔴 LOSE</button>
                        <button onclick="cambiarEstatus('${id}', 'pendiente')" style="background:#555;">⏳ Reset</button>
                        <button onclick="eliminarPronostico('${id}')" style="background:#222; color:#f44336; border:1px solid #444;">🗑️</button>
                    </div>
                </div>
            `;
        });
    });
</script>
</body>
</html>
