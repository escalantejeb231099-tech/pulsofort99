<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: auto; }
        
        /* Contenedor del Logo de inicio */
        #logoContainer { text-align: center; margin: 20px 0; }
        .logo-main { max-width: 160px; height: auto; border-radius: 12px; display: inline-block; }

        .cat-box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; text-align: center; }
        h2 { color: #ffc107; font-size: 16px; border-left: 4px solid #ffc107; padding-left: 10px; margin-top: 30px; text-transform: uppercase; }
        .post-card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; border: 1px solid #3d3d3d; }
        
        /* Contenedor del QR de WhatsApp (recorte visual automático) */
        .qr-container { width: 190px; height: 190px; overflow: hidden; margin: 10px auto; border: 3px solid #ffc107; border-radius: 10px; background: #000; }
        .qr-img { width: 280px; margin-left: -45px; margin-top: -55px; }
    </style>
</head>
<body>
<div class="container">
    <!-- Logo Dinámico de la Pantalla Principal -->
    <div id="logoContainer"></div>

    <!-- Sección de Contacto y QR de WhatsApp -->
    <div class="cat-box">
        <h3 style="margin:0 0 10px 0; color:#ffc107; font-size:13px;">CONTACTO VIP WHATSAPP</h3>
        <div class="qr-container" id="qrContainerBox">
            <!-- El QR se cargará dinámicamente o usará el de respaldo -->
            <img id="whatsappQrImg" src="" class="qr-img">
        </div>
        <p style="font-size:11px; color:#aaa; margin:5px 0 0 0;">Escanea el código para chatear directamente</p>
    </div>

    <h2>HIPISMO</h2>
    <div id="hipismoArea"></div>

    <h2>DEPORTES</h2>
    <div id="deportesArea"></div>
</div>

<script src="firebase-config.js"></script>
<script>
    // 1. Cargar la configuración general (Logo y WhatsApp/QR) desde Firebase en tiempo real
    db.collection("configuracion").doc("general").onSnapshot(doc => {
        if(doc.exists) {
            let data = doc.data();
            
            // Mostrar Logo principal si está configurado
            if(data.logoUrl) {
                document.getElementById('logoContainer').innerHTML = `<img src="${data.logoUrl}" class="logo-main" alt="Logo PulsoFort99">`;
            } else {
                document.getElementById('logoContainer').innerHTML = `<h1 style="color:#ffc107; font-size:24px; margin:0;">PulsoFort99</h1>`;
            }

            // Mostrar la imagen del QR de WhatsApp configurada (usará la que subiste por defecto o la que pongas en el admin)
            let qrUrl = data.logoUrl || "https://i.postimg.cc/pVsx2bBr/IMG-20250608-151525.jpg";
            document.getElementById('whatsappQrImg').src = qrUrl;
        }
    });

    // 2. Cargar pronósticos en tiempo real y separarlos por categoría
    db.collection("pronosticos").orderBy("fecha", "desc").onSnapshot(snap => {
        let h = '', d = '';
        snap.forEach(doc => {
            let item = doc.data();
            let card = `<div class="post-card"><b style="color:#ffc107; font-size:14px; display:block; margin-bottom:4px;">${item.titulo}</b><span style="color:#ddd;">${item.detalles}</span></div>`;
            
            if(item.categoria && item.categoria.toLowerCase().includes('hipismo')) {
                h += card;
            } else {
                d += card;
            }
        });
        
        document.getElementById('hipismoArea').innerHTML = h || '<p style="font-size:12px; color:#666;">No hay pronósticos de hipismo activos.</p>';
        document.getElementById('deportesArea').innerHTML = d || '<p style="font-size:12px; color:#666;">No hay pronósticos de deportes activos.</p>';
    });
</script>
</body>
</html>
