<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PulsoFort99</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>PulsoFort99</h1>
    
    <h2>Hipismo</h2>
    <div id="hipismoArea"></div>

    <h2>Deportes</h2>
    <div id="deportesArea"></div>

    <script src="firebase-config.js"></script>
    <script>
        db.collection("pronosticos").orderBy("fecha", "desc").onSnapshot(snap => {
            let hipismoHtml = '';
            let deportesHtml = '';
            
            snap.forEach(doc => {
                let d = doc.data();
                let item = `<div><b>${d.titulo}</b><p>${d.detalles}</p></div><hr>`;
                
                if(d.categoria === 'Hipismo') {
                    hipismoHtml += item;
                } else {
                    deportesHtml += item;
                }
            });
            
            document.getElementById('hipismoArea').innerHTML = hipismoHtml;
            document.getElementById('deportesArea').innerHTML = deportesHtml;
        });
    </script>
</body>
</html>
