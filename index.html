<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: auto; }
        
        #logoContainer { text-align: center; margin-bottom: 20px; }
        .logo-main { max-width: 150px; height: auto; border-radius: 12px; display: inline-block; }

        .cat-box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; text-align: center; }
        
        .qr-container { width: 160px; height: 160px; overflow: hidden; margin: 10px auto; border: 3px solid #ffc107; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .qr-img { width: 150px; height: 150px; object-fit: contain; }

        h2 { color: #ffc107; font-size: 15px; border-left: 4px solid #ffc107; padding-left: 10px; margin-top: 25px; text-transform: uppercase; }
        .post-card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border: 1px solid #333; }
    </style>
</head>
<body>
<div class="container">
    <!-- Logo principal en la pantalla de inicio -->
    <div id="logoContainer"></div>

    <!-- Sección del Código QR de WhatsApp -->
    <div class="cat-box">
        <h3 style="margin:0 0 5px 0; color:#ffc107; font-size:13px;">CONTACTO VIP WHATSAPP</h3>
        <div class="qr-container">
            <img src="https://i.postimg.cc/pVsx2bBr/IMG-20250608-151525.jpg" class="qr-img" alt="QR WhatsApp">
        </div>
        <p style="font-size:11px; color:#aaa; margin:5px 0 0 0;">Escanea el código para chatear directamente</p>
    </div>

    <h2>HIPISMO</h2>
    <div id="hipismoArea"></div>

    <h2>DEPORTES</h2>
    <div id="deportesArea"></div>
</div>

<script src="firebase-config.js"></script>
<script>
    // Carga el logo configurado desde el panel de administración
    db.collection("configuracion").doc("general").onSnapshot(doc => {
        if(doc.exists && doc.data().logoUrl) {
            document.getElementById('logoContainer').innerHTML = `<img src="${doc.data().logoUrl}" class="logo-main" alt="Logo PulsoFort99">`;
        } else {
            document.getElementById('logoContainer').innerHTML = `<h1 style="color:#ffc107; font-size:22px; margin:0;">PulsoFort99</h1>`;
        }
    });

    // Carga y separa los pronósticos en tiempo real
    db.collection("pronosticos").orderBy("fecha", "desc").onSnapshot(snap => {
        let h = '', d = '';
        snap.forEach(doc => {
            let item = doc.data();
            let card = `<div class="post-card"><b style="color:#ffc107; font-size:13px; display:block; margin-bottom:4px;">${item.titulo}</b><span style="color:#ccc;">${item.detalles}</span></div>`;
            
            if(item.categoria && item.categoria.toLowerCase() === 'hipismo') {
                h += card;
            } else {
                d += card;
            }
        });
        
        document.getElementById('hipismoArea').innerHTML = h || '<p style="font-size:12px; color:#666;">No hay pronósticos de hipismo.</p>';
        document.getElementById('deportesArea').innerHTML = d || '<p style="font-size:12px; color:#666;">No hay pronósticos de deportes.</p>';
    });
</script>
</body>
</html>
