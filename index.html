<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PulsoFort99 | Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0A0A0A; color: #F5F5F5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: auto; }
        #logoArea img { max-width: 120px; display: block; margin: 0 auto 30px; border-radius: 4px; }
        .stats-box { display: flex; justify-content: space-between; background: #121212; padding: 25px; border-radius: 4px; border: 1px solid #D4AF37; margin-bottom: 20px; }
        .stat { text-align: center; }
        .stat span { display: block; font-size: 24px; font-weight: 800; color: #D4AF37; }
        .stat small { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .post-card { background: #121212; padding: 20px; border-radius: 4px; margin-bottom: 15px; border-left: 2px solid #D4AF37; border-bottom: 1px solid #1E1E1E; }
        .badge { font-size: 9px; padding: 3px 6px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
<div class="container">
    <div id="logoArea"></div>
    <div class="stats-box">
        <div class="stat"><span id="efectividad">0%</span><small>Efectividad</small></div>
        <div class="stat"><span id="aciertos">0</span><small>Aciertos</small></div>
        <div class="stat"><span id="fallos">0</span><small>Fallos</small></div>
    </div>
    <div id="postsArea"></div>
</div>
<script src="firebase-config.js"></script>
<script>
    db.collection("configuracion").doc("general").onSnapshot(doc => {
        if(doc.data()?.logoUrl) document.getElementById('logoArea').innerHTML = `<img src="${doc.data().logoUrl}">`;
    });
    db.collection("pronosticos").onSnapshot(snap => {
        let g = 0, p = 0, html = '';
        snap.forEach(doc => {
            let d = doc.data();
            if(d.resultado === 'ganador') g++;
            if(d.resultado === 'perdedor') p++;
            html += `<div class="post-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="font-size:10px; color:#D4AF37;">${d.categoria}</span>
                <span class="badge" style="color:${d.resultado=='ganador'?'#15803d':'#991b1b'}">${d.resultado}</span></div>
                <b style="font-size:15px; display:block; margin-bottom:5px;">${d.titulo}</b>
                <p style="font-size:12px; color:#888; margin:0;">${d.detalles}</p>
            </div>`;
        });
        document.getElementById('efectividad').innerText = (g+p)>0 ? Math.round(g/(g+p)*100) + '%' : '0%';
        document.getElementById('aciertos').innerText = g;
        document.getElementById('fallos').innerText = p;
        document.getElementById('postsArea').innerHTML = html;
    });
</script>
</body>
</html>
