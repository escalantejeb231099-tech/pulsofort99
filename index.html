<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PulsoFort99 | Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0A0A0A; color: #F5F5F5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: auto; }
        #logoArea img { max-width: 140px; display: block; margin: 0 auto 30px; border-radius: 4px; }
        .stats-box { display: flex; justify-content: space-between; background: #121212; padding: 20px; border-radius: 4px; border: 1px solid #D4AF37; margin-bottom: 20px; }
        .stat { text-align: center; }
        .stat span { display: block; font-size: 22px; font-weight: 800; color: #D4AF37; }
        .stat small { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .post-card { background: #121212; padding: 20px; border-radius: 4px; margin-bottom: 15px; border-left: 3px solid #D4AF37; }
        .badge { font-size: 9px; padding: 3px 6px; font-weight: 800; text-transform: uppercase; color: #D4AF37; }
        .btn-ws { background: #16a34a; color: #fff; padding: 15px; width: 100%; border: none; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="logoArea"></div>
    <div class="stats-box">
        <div class="stat"><span id="efectividad">0%</span><small>Efectividad</small></div>
        <div class="stat"><span id="aciertos">0</span><small>Aciertos</small></div>
        <div class="stat"><span id="fallos">0</span><small>Fallos</small></div>
    </div>
    <div id="postsArea"></div>
    <div class="card" style="background:#121212; padding:15px; border-radius:4px; margin-bottom:20px;">
        <h3 style="color:#D4AF37; font-size:10px;">💳 Métodos de Pago</h3>
        <p style="font-size:12px; color:#888;">Pago Móvil: <span id="pm" style="color:#fff;">...</span></p>
        <p style="font-size:12px; color:#888;">Binance: <span id="bin" style="color:#fff;">...</span></p>
    </div>
    <button class="btn-ws" onclick="abrirWhatsApp()">Contactar por WhatsApp</button>
</div>
<script src="firebase-config.js"></script>
<script>
    let numWs = '';
    db.collection("configuracion").doc("general").onSnapshot(doc => {
        if(doc.data()?.logoUrl) document.getElementById('logoArea').innerHTML = `<img src="${doc.data().logoUrl}">`;
        if(doc.data()?.whatsapp) numWs = doc.data().whatsapp.replace(/[^0-9]/g, '');
    });
    function abrirWhatsApp() { if(numWs) window.open(`https://wa.me/${numWs}`); else alert("Configura WhatsApp en el admin"); }
    db.collection("configuracion").doc("pagos").onSnapshot(doc => {
        document.getElementById('pm').innerText = doc.data()?.pagoMovil || 'No configurado';
        document.getElementById('bin').innerText = doc.data()?.binance || 'No configurado';
    });
    db.collection("pronosticos").onSnapshot(snap => {
        let g=0, p=0, html='';
        snap.forEach(doc => {
            let d = doc.data();
            if(d.resultado === 'ganador') g++; else if(d.resultado === 'perdedor') p++;
            html += `<div class="post-card"><span class="badge">${d.categoria}</span><br><b style="font-size:14px; color:#fff;">${d.titulo}</b><p style="font-size:12px; color:#888;">${d.detalles}</p></div>`;
        });
        document.getElementById('efectividad').innerText = (g+p)>0 ? Math.round(g/(g+p)*100) + '%' : '0%';
        document.getElementById('aciertos').innerText = g;
        document.getElementById('fallos').innerText = p;
        document.getElementById('postsArea').innerHTML = html;
    });
</script>
</body>
</html>
